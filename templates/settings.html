{% extends "base.html" %}
{% block content %}

<div class="stack">
  <div class="page-header">
    <h1>Settings</h1>
  </div>

  <div class="content-card card-wide">
    <!-- Settings form -->
    <form method="post" class="form">
      <div class="form-row">
        <label for="current_month_start">Current month start</label>
        <input id="current_month_start" type="date" name="current_month_start"
               value="{{ settings.current_month_start }}" required>
      </div>

      <div class="form-row">
        <label for="current_month_end">Current month end</label>
        <input id="current_month_end" type="date" name="current_month_end"
               value="{{ settings.current_month_end }}" required>
      </div>

      <div class="form-row">
        <label for="monthly_deal_target">Monthly deal target</label>
        <input id="monthly_deal_target" type="number" name="monthly_deal_target"
               value="{{ settings.monthly_deal_target }}" required>
      </div>

      <div class="form-row">
        <label for="stretch_goal">Stretch goal</label>
        <input id="stretch_goal" type="number" name="stretch_goal"
               value="{{ settings.stretch_goal }}" required>
      </div>

      <div class="form-actions">
        <button type="submit" class="submit">Save settings</button>
      </div>
    </form>

    <!-- Finalize month -->
    <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 18px 0;">

    <form action="{{ url_for('finalize_month') }}" method="post" class="form">
      <p class="hint">Finalize saves the current month totals into the month comparison table.</p>

      <div class="form-actions">
        <button type="submit" class="submit">Finalize month and save scores</button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
