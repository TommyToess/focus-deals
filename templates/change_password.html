{% extends "base.html" %}
{% block content %}
<select name="security_question" required>
    <option value="" disabled selected>
        Select a security question
    </option>

    {% for q in questions %}
        <option value="{{ q }}">{{ q }}</option>
    {% endfor %}
</select>

<input type="text"
       name="security_answer"
       placeholder="Your answer"
       required>
{% endblock %}
