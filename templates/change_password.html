{% extends "base.html" %}
{% block content %}

<div class="stack">
  <div class="page-header">
    <h1>Set your password</h1>
  </div>

  <div class="content-card card-tight">
    {% if needs_security_setup %}
      <p class="hint">First time login: choose a display name, security question, and set a new password.</p>
    {% endif %}

    <form class="form" method="POST" action="{{ url_for('change_password') }}">
      {% if needs_security_setup %}
        <div class="form-row">
          <label for="display_name">Display name (optional)</label>
          <input id="display_name" type="text" name="display_name"
                 placeholder="What shows in the app">
        </div>

        <div class="form-row">
          <label for="security_question">Security question</label>
          <select id="security_question" name="security_question" required>
            <option value="" disabled selected>Select a security question</option>
            {% for q in questions %}
              <option value="{{ q }}">{{ q }}</option>
            {% endfor %}
          </select>
        </div>
