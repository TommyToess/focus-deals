{% extends "base.html" %}
{% block content %}

<div class="stack">
  <div class="page-header">
    <h1>Set your password</h1>
  </div>

  <div class="content-card card-tight">
    {% if needs_security_setup %}
    <p class="hint">First time login: choose a security question and set a new password.</p>

    <form class="form" method="POST" action="{{ url_for('change_password') }}">
      <div class="form-row">
        <label for="security_question">Security question</label>
        <select id="security_question" name="security_question" required>
          <option value="" disabled selected>Select a security question</option>
          {% for q in questions %}
            <option value="{{ q }}">{{ q }}</option>
          {% endfor %}
        </select>
      </div>
        <div class="form-row">
          <label>Security Answer</label>
          <input type="text" name="security_answer" required>
        </div>
      {% endif %}
      <div class="form-row">
        <label for="new_password">New password</label>
        <input id="new_password" type="password" name="new_password" placeholder="New password" required>
      </div>

      <div class="form-row">
        <label for="confirm_password">Confirm password</label>
        <input id="confirm_password" type="password" name="confirm_password" placeholder="Confirm password" required>
      </div>

      <div class="form-actions">
        <button type="submit" class="submit">Save</button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
