{% extends "base.html" %}
{% block content %}

<h1 style="text-align:center;">📜 History</h1>

<table>
    <thead>
        <tr>
            <th>Date</th>
            <th>Employee</th>
            <th>Shift</th>
            <th>Hours</th>
            <th>Deals</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for entry in entries %}
        <tr>
            <td>{{ entry.date.strftime('%Y-%m-%d') }}</td>
            <td>{{ entry.employee }}</td>
            <td>{{ entry.shift }}</td>
            <td>{{ entry.hours }}</td>
            <td>{{ entry.deals }}</td>
            <td>
                <button class="edit-btn" onclick="openEditModal({{ entry.id }})">Edit</button>
                <a href="{{ url_for('delete_entry', id=entry.id) }}"><button class="delete">Delete</button></a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<!-- Edit Modal -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeEditModal()">&times;</span>
        <h2>Edit Entry</h2>
        <form id="editForm">
            <input type="hidden" name="id" id="editId">

            <label>Employee:</label>
            <select name="employee" id="editEmployee" required>
                <option>Sarah</option>
                <option>Angie</option>
                <option>Beth</option>
                <option>Terry</option>
                <option>Jeff</option>
                <option>Vernon</option>
            </select>

            <label>Date:</label>
            <input type="date" name="date" id="editDate" required>

            <label>Shift:</label>
            <select name="shift" id="editShift" required>
                <option>Open</option>
                <option>Mid</option>
                <option>Close</option>
            </select>

            <label>Hours:</label>
            <input type="number" step="0.1" name="hours" id="editHours" required>

            <label>Deals:</label>
            <input type="number" name="deals" id="editDeals" required>

            <button type="submit" class="submit">Save Changes</button>
        </form>
    </div>
</div>

<script>
function openEditModal(id){
    fetch(`/get_entry/${id}`)
    .then(res => res.json())
    .then(entry => {
        document.getElementById('editId').value = entry.id;
        document.getElementById('editEmployee').value = entry.employee;
        document.getElementById('editDate').value = entry.date;
        document.getElementById('editShift').value = entry.shift;
        document.getElementById('editHours').value = entry.hours;
        document.getElementById('editDeals').value = entry.deals;
        document.getElementById('editModal').style.display='block';
    });
}

function closeEditModal(){
    document.getElementById('editModal').style.display='none';
}

document.getElementById('editForm').addEventListener('submit', function(e){
    e.preventDefault();
    const id = document.getElementById('editId').value;

    fetch(`/edit_entry/${id}`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
            employee: document.getElementById('editEmployee').value,
            date: document.getElementById('editDate').value,
            shift: document.getElementById('editShift').value,
            hours: parseFloat(document.getElementById('editHours').value),
            deals: parseInt(document.getElementById('editDeals').value)
        })
    }).then(res=>{if(res.ok) location.reload();});
});
</script>

{% endblock %}
