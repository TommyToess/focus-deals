<form class="form" method="POST" action="{{ url_for('reset_password_secure') }}">
  {% if needs_security_setup %}
    <div class="form-row">
      <label for="display_name">Display name (optional)</label>
      <input id="display_name" type="text" name="display_name" placeholder="What shows in the app">
    </div>

    <div class="form-row">
      <label for="security_question">Security question</label>
      <select id="security_question" name="security_question" required>
        <option value="" disabled selected>Select a security question</option>
        {% for q in questions %}
          <option value="{{ q }}">{{ q }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-row">
      <label for="security_answer">Security answer</label>
      <input id="security_answer" type="text" name="security_answer" required>
    </div>
  {% endif %}

  <div class="form-row">
    <label for="new_password">New password</label>
    <input id="new_password" type="password" name="new_password" required>
  </div>

  <div class="form-row">
    <label for="confirm_password">Confirm password</label>
    <input id="confirm_password" type="password" name="confirm_password" required>
  </div>

  <div class="form-actions">
    <button type="submit" class="submit">Save</button>
  </div>
</form>
