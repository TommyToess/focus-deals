{% extends "base.html" %}
{% block content %}

<h2>Manage Users</h2>

<!-- Create User -->
<div class="content-card">
    <h3>Add User</h3>
    <form method="POST" action="{{ url_for('create_user') }}">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Temp password (optional)">
        <label>
            <input type="checkbox" name="is_admin"> Admin
        </label>
        <button type="submit">Create User</button>
    </form>
</div>

<!-- Existing Users -->
<div class="content-card">
    <h3>Existing Users</h3>

    {% for user in users %}
    <form method="POST" action="{{ url_for('update_user', user_id=user.id) }}" class="user-row">
        <input type="text" name="username" value="{{ user.username }}" required>

        <label>
            <input type="checkbox" name="is_admin" {% if user.is_admin %}checked{% endif %}>
            Admin
        </label>

        <label>
            <input type="checkbox" name="must_change_password"
                   {% if user.must_change_password %}checked{% endif %}>
            Force password change
        </label>

        <button type="submit">Save</button>
    </form>

    <form method="POST"
          action="{{ url_for('reset_user_password', user_id=user.id) }}"
          style="display:inline;">
        <button type="submit">Reset Password</button>
    </form>

    {% if user.id != session.get('user_id') %}
    <form method="POST"
          action="{{ url_for('delete_user', user_id=user.id) }}"
          style="display:inline;"
          onsubmit="return confirm('Delete this user?');">
        <button type="submit">Delete</button>
    </form>
    {% endif %}
    <hr>
    {% endfor %}
</div>

{% endblock %}
