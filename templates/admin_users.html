{% extends "base.html" %}
{% block content %}

<h2>Manage Users</h2>

<!-- Create User -->
<div class="content-card">
    <h3>Add User</h3>
    <form method="POST" action="{{ url_for('create_user') }}">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Temp password (optional)">
        <label>
            <input type="checkbox" name="is_admin"> Admin
        </label>
        <button type="submit">Create User</button>
    </form>
</div>

<!-- Existing Users -->
<div class="content-card">
    <h3>Existing Users</h3>

    {% for user in users %}
    <div class="user-row">

        <form method="POST" action="{{ url_for('update_user', user_id=user.id) }}" class="user-form">
            <input type="text" name="username" value="{{ user.username }}" required>

            <label class="checkbox">
                <input type="checkbox" name="is_admin"
                       {% if user.is_admin %}checked{% endif %}>
                Admin
            </label>

            <label class="checkbox">
                <input type="checkbox" name="must_change_password"
                       {% if user.must_change_password %}checked{% endif %}>
                Force password change
            </label>

            <button type="submit" class="btn-primary">Save</button>
        </form>

        <form method="POST"
              action="{{ url_for('reset_user_password', user_id=user.id) }}">
            <button type="submit" class="btn-secondary">Reset Password</button>
        </form>

        {% if user.id != session.get('user_id') %}
        <form method="POST"
              action="{{ url_for('delete_user', user_id=user.id) }}"
              onsubmit="return confirm('Delete this user?');">
            <button type="submit" class="btn-danger">Delete</button>
        </form>
        {% endif %}

    </div>
    {% endfor %}
</div>


{% endblock %}
