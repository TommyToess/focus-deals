{% extends "base.html" %}
{% block content %}

<div class="page-container">
  <div class="page-header">
    <h1>Manage Users</h1>
    <button class="submit" id="add-user-btn">➕ Add User</button>
  </div>

  <div class="form" style="margin-bottom: 20px;">
    <input type="text" placeholder="Search users..." style="max-width: 300px;">
  </div>

  <div class="content-card card-wide">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Display Name</th>
            <th>Username</th>
            <th>Role</th>
            <th>Active</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for user in users %}
          <tr>
            <td>{{ user.display_name or '—' }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.role }}</td>
            <td>
              {% if user.active %}
                ✅
              {% else %}
                ❌
              {% endif %}
            </td>
            <td>
              <div class="user-actions">
                <form method="POST" action="{{ url_for('admin_users_edit', username=user.username) }}">
                  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                  <button type="submit" class="submit secondary">✏️ Edit</button>
                </form>
                <form method="POST" action="{{ url_for('admin_users_delete', username=user.username) }}"
                      onsubmit="return confirm('Are you sure you want to delete this user?');">
                  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                  <button type="submit" class="submit danger">🗑 Delete</button>
                </form>
              </div>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Add User Modal -->
<div class="modal" id="add-user-modal" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-header">
      <h3>Add New User</h3>
      <button type="button" class="modal-close" id="close-user-modal">✕</button>
    </div>

    <form method="POST" action="{{ url_for('admin_users_add') }}" class="modal-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <label>Username</label>
      <input type="text" name="username" required>

      <label>Display Name</label>
      <input type="text" name="display_name">

      <label>Password</label>
      <input type="password" name="password" required>

      <label>Role</label>
      <select name="role" required>
        <option value="employee">Employee</option>
        <option value="admin">Admin</option>
      </select>

      <label>Active</label>
      <select name="active">
        <option value="1" selected>Yes</option>
        <option value="0">No</option>
      </select>

      <button type="submit" class="submit" style="margin-top:10px;">Create User</button>
    </form>
  </div>
</div>

<script>
  const addUserBtn = document.getElementById("add-user-btn");
  const userModal = document.getElementById("add-user-modal");
  const closeModalBtn = document.getElementById("close-user-modal");

  function openUserModal() {
    userModal.classList.add("show");
    userModal.setAttribute("aria-hidden", "false");
  }

  function closeUserModal() {
    userModal.classList.remove("show");
    userModal.setAttribute("aria-hidden", "true");
  }

  addUserBtn?.addEventListener("click", openUserModal);
  closeModalBtn?.addEventListener("click", closeUserModal);

  userModal?.addEventListener("click", (e) => {
    if (e.target === userModal) closeUserModal();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeUserModal();
  });
</script>

{% endblock %}
