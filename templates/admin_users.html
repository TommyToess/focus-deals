{% extends "base.html" %}
{% block content %}

<div class="stack admin-users-page">
  <div class="page-header">
    <h1>Manage Users</h1>
  </div>

  <!-- Add User -->
  <div class="content-card card-wide">
    <h3 style="margin-top:0;">Add User</h3>

    <form method="POST" action="{{ url_for('create_user') }}" class="form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-row">
        <label for="new_username">Username</label>
        <input id="new_username" type="text" name="username" placeholder="username" required>
      </div>

      <div class="form-row">
        <label for="new_display_name">Display name</label>
        <input id="new_display_name" type="text" name="display_name" placeholder="What shows in the app (optional)">
      </div>

      <div class="form-row">
        <label for="new_password">Temp password (optional)</label>
        <input id="new_password" type="password" name="password" placeholder="Temp password (optional)">
      </div>

      <div class="form-row checkbox-row">
        <label class="checkbox-inline">
          <input type="checkbox" name="is_admin">
          <span>Admin</span>
        </label>
      </div>

      <div class="form-actions">
        <button type="submit" class="submit">Create User</button>
      </div>
    </form>
  </div>

  <!-- Existing Users -->
  <div class="content-card card-wide">
    <h3 style="margin-top:0;">Existing Users</h3>

    <div class="stack" style="gap:14px;">
      {% for user in users %}
      <div class="user-card">
        <form method="POST" action="{{ url_for('update_user', user_id=user.id) }}" class="form">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="form-row">
            <label for="u{{ user.id }}_username">Username</label>
            <input id="u{{ user.id }}_username" type="text" name="username" value="{{ user.username }}" required>
          </div>

          <div class="form-row">
            <label for="u{{ user.id }}_display_name">Display name</label>
            <input id="u{{ user.id }}_display_name" type="text" name="display_name"
                   value="{{ user.display_name or user.username }}">
          </div>

          <div class="form-row checkbox-row">
            <label class="checkbox-inline">
              <input type="checkbox" name="is_admin" {% if user.is_admin %}checked{% endif %}>
              <span>Admin</span>
            </label>

            <label class="checkbox-inline">
              <input type="checkbox" name="must_change_password"
                     {% if user.must_change_password %}checked{% endif %}>
              <span>Force password change</span>
            </label>
          </div>

          <div class="form-actions user-actions">
            <button type="submit" class="submit">Save</button>
          </div>
        </form>

        <div class="form-actions user-actions">
          <form method="POST" action="{{ url_for('reset_user_password', user_id=user.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="submit secondary">Reset Password</button>
          </form>

          {% if user.id != session.get('user_id') %}
          <form method="POST" action="{{ url_for('delete_user', user_id=user.id) }}"
                onsubmit="return confirm('Delete this user?');">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="submit danger">Delete</button>
          </form>
          {% endif %}
        </div>
      </div>
      {% endfor %}
    </div>

  </div>
</div>

{% endblock %}
