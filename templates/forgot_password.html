{% extends "base.html" %}
{% block content %}

<div class="stack">
  <div class="page-header">
    <h1>Forgot password</h1>
  </div>

  <div class="content-card card-tight">
    <p class="hint">Enter your username. You will answer your security question to reset your password.</p>

    <form class="form" method="POST" action="{{ url_for('forgot_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-row">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" placeholder="Username" required>
      </div>

      <div class="form-actions">
        <a href="{{ url_for('login') }}" class="muted">Back to login</a>
        <button type="submit" class="submit">Continue</button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
