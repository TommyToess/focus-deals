{% extends "base.html" %}
{% block content %}

<div class="stack">
  <div class="page-header">
    <h1>Ask the data</h1>
    <span class="badge">AI assistant</span>
  </div>

  <div class="content-card card-wide">
    <div class="chat-shell">
      <div id="chat-window" class="chat-window" aria-live="polite"></div>

      <form id="chat-form" class="form-inline" style="align-items: stretch;">
        <div class="form-row" style="flex:1; min-width: 220px;">
          <label for="question">Your question</label>
          <input type="text" id="question" placeholder="Ask about goals, hours, deals, leaderboard, etc." required>
        </div>

        <button type="submit" class="submit" style="height: 42px;">Send</button>
      </form>

      <p id="error-msg" class="hint" style="color:#b42318; display:none;"></p>
    </div>
  </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
const chatWindow = document.getElementById('chat-window');
const form = document.getElementById('chat-form');
const input = document.getElementById('question');
const errorMsg = document.getElementById('error-msg');

function setError(msg) {
  if (!msg) {
    errorMsg.style.display = 'none';
    errorMsg.textContent = '';
    return;
  }
  errorMsg.style.display = 'block';
  errorMsg.textContent = msg;
}

function appendBubble(role, content) {
  const div = document.createElement('div');
  div.className = 'bubble ' + (role === 'user' ? 'user' : 'assistant');
  div.textContent = content;
  chatWindow.appendChild(div);
  chatWindow.scrollTop = chatWindow.scrollHeight;
  return div;
}

function appendTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'bubble assistant';

  const typing = document.createElement('div');
  typing.className = 'typing';

  const d1 = document.createElement('span');
  d1.className = 'dot';
  const d2 = document.createElement('span');
  d2.className = 'dot';
  const d3 = document.createElement('span');
  d3.className = 'dot';

  typing.appendChild(d1);
  typing.appendChild(d2);
  typing.appendChild(d3);
  wrap.appendChild(typing);
  chatWindow.appendChild(wrap);
  chatWindow.scrollTop = chatWindow.scrollHeight;
  return wrap;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  setError('');

  const question = input.value.trim();
  if (!question) return;

  appendBubble('user', question);
  input.value = '';

  const typingBubble = appendTyping();

  try {
    const res = await fetch('{{ url_for("ask_ajax") }}', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });

    const data = await res.json();
    typingBubble.remove();

    if (!res.ok) {
      setError(data.error || 'AI service error.');
      return;
    }

    if (data.error) {
      setError(data.error);
      return;
    }

    appendBubble('assistant', data.answer || '');
  } catch (err) {
    typingBubble.remove();
    setError('AI service unavailable.');
    console.error(err);
  }
});
</script>
{% endblock %}
