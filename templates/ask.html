{% extends "base.html" %}
{% block content %}

<h2>Ask the Assistant</h2>

<div id="chat-box" style="border:1px solid #ccc; padding:10px; height:300px; overflow-y:auto;"></div>

<form id="chat-form">
    <input type="text" id="question" placeholder="Ask a question..." required>
    <button type="submit">Ask</button>
</form>

<script>
const form = document.getElementById("chat-form");
const chatBox = document.getElementById("chat-box");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const input = document.getElementById("question");
    const msg = input.value.trim();
    if (!msg) return;

    chatBox.innerHTML += `<p><strong>You:</strong> ${msg}</p>`;
    input.value = "";

    chatBox.innerHTML += `<p id="typing">Assistant is typing<span>.</span><span>.</span><span>.</span></p>`;
    chatBox.scrollTop = chatBox.scrollHeight;

    const res = await fetch("/ask_ajax", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({question: msg})
    });

    document.getElementById("typing").remove();

    const data = await res.json();
    chatBox.innerHTML += `<p><strong>Assistant:</strong> ${data.answer}</p>`;
    chatBox.scrollTop = chatBox.scrollHeight;
});
</script>

{% endblock %}
