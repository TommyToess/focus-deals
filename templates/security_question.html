{% extends "base.html" %}
{% block content %}

<div class="stack">
  <div class="page-header">
    <h1>Security question</h1>
  </div>

  <div class="content-card card-tight">
    <p style="font-weight:800;">{{ question }}</p>

    <form class="form" method="POST" action="{{ url_for('security_question') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-row">
        <label for="answer">Your answer</label>
        <input id="answer" type="text" name="answer" placeholder="Answer" required>
      </div>

      <div class="form-actions">
        <a href="{{ url_for('forgot_password') }}" class="muted">Back</a>
        <button type="submit" class="submit">Verify</button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
